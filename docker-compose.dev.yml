services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data_dev:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/mern_boilerplate
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_mern_docker_secret_key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "${API_PORT:-5050}:5000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_PROXY: http://server:5000
    ports:
      - "${CLIENT_DEV_PORT:-5173}:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules

volumes:
  mongo_data_dev:
  server_node_modules:
  client_node_modules:
